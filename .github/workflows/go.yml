# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.work
          cache-dependency-path: |
            backend/cmd/go.sum
            backend/internal/patients/go.sum
            backend/pkg/go.sum

      - name: Build
        working-directory: backend/cmd
        run: go build -v ./...

      - name: Test modules
        working-directory: backend
        run: go test -v ./cmd/... ./internal/patients/... ./pkg/...

      - name: Run integration tests
        if: github.event_name != 'pull_request'
        working-directory: backend/internal/patients
        env:
          RUN_SUPABASE_INTEGRATION: "true"
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_KEY: ${{ secrets.SUPABASE_TEST_KEY }}
        run: go test -tags=integration -run '^TestStorePatientCRUD$' -v ./...
